<!DOCTYPE html>
<html lang="bn">
<head><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Play_Ground Pro</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f2f5f9;
}

header {
  background: #0b5d3b;
  color: white;
  padding: 20px;
  text-align: center;
}

.container {
  padding: 20px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 2px 8px #ddd;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 8px;
  background: #0b5d3b;
  color: white;
  font-size: 16px;
}

form {
  background: white;
  padding: 20px;
  margin-top: 20px;
  border-radius: 12px;
}

input, select {
  width: 100%;
  padding: 12px;
  margin: 8px 0 15px;
  box-sizing: border-box;
}
</style>
</head>

<body>

<header>
  <h1>Play_Ground Pro</h1>
  <p>Football & Cricket Turf Management</p>
</header>

<div class="container">

  <div class="cards">
    <div class="card">
      <h3>⚽ Football</h3>
      <p>Booking Management</p>
    </div>

    <div class="card">
      <h3>🏏 Cricket</h3>
      <p>Booking Management</p>
    </div>

    <div class="card">
      <h3>💰 আজকের আয়</h3>
      <p>৳ 0</p>
    </div>

    <div class="card">
      <h3>📅 মোট বুকিং</h3>
      <p>0</p>
    </div>
  </div>

  <button onclick="showBookingForm()">➕ New Booking</button>

  <div id="bookingForm" style="display:none;">

    <form>
      <h2>New Booking</h2>

      <label>Customer Name</label>
      <input type="text" placeholder="গ্রাহকের নাম" required>

      <label>Mobile Number</label>
      <input type="tel" placeholder="মোবাইল নম্বর" required>

      <label>Sport Type</label>
      <select required>
        <option value="">নির্বাচন করুন</option>
        <option>Football</option>
        <option>Cricket</option>
      </select>

      <label>Booking Date</label>
      <input type="date" required>

      <label>Start Time</label>
      <input type="time" required>

      <label>End Time</label>
      <input type="time" required>

      <label>Advance Payment</label>
      <input type="number" placeholder="অগ্রিম টাকা">

      <button type="button" onclick="saveBooking()">
        Save Booking
      </button>
    </form>

  </div>

</div>

<script>
function showBookingForm() {
  document.getElementById("bookingForm").style.display = "block";
}
</script>

<script>
const SUPABASE_URL = "https://hnmciqupyakugesclfnw.supabase.co";

const SUPABASE_KEY = "আপনার_Publishable_Key_এখানে_দিন";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

console.log("Supabase Connected");
</script>
<script>
async function saveBooking() {
  const form = document.querySelector("form");
  const inputs = form.querySelectorAll("input");
  const select = form.querySelector("select");

  const customerName = inputs[0].value;
  const mobile = inputs[1].value;
  const sportType = select.value;
  const bookingDate = inputs[2].value;
  const startTime = inputs[3].value;
  const endTime = inputs[4].value;
  const advance = inputs[5].value || 0;

  const { data, error } = await supabaseClient
    .from("bookings")
    .insert([{
      customer_name: customerName,
      mobile: mobile,
      sport_type: sportType,
      booking_date: bookingDate,
      start_time: startTime,
      end_time: endTime,
      advance: advance
    }]);

  if (error) {
    alert("Booking Error: " + error.message);
  } else {
    alert("Booking সফলভাবে সংরক্ষণ হয়েছে!");
    form.reset();
  }
}
</script>
</body>
</html>
